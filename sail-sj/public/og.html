<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stuff</title>
    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>
    <script>
        navigator.serviceWorker.register("/sail/sw.js")
    </script>
</head>
<body>
<script>
        window.addEventListener('beforeunload', function (event) {
            event.preventDefault();
            event.returnValue = ''; 
        });
    </script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        .topbar { position:relative; z-index:10; display:flex; align-items:center; gap:8px; padding:8px; box-sizing:border-box; width:100%; background:#fff; border-bottom:1px solid #ddd; }
        #bar { flex:1; min-width:0; padding:6px 10px; border:1px solid #ccc; border-radius:4px; font-size:14px; }
        #bar:focus { outline:none; border-color:#888; }
        #server { flex:0 0 120px; padding:6px; border:1px solid #ccc; border-radius:4px; font-size:13px; }
        .stat { display:flex; align-items:center; gap:5px; font-size:12px; color:#666; flex-shrink:0; }
        .dot { width:8px; height:8px; border-radius:50%; background:#ccc; flex-shrink:0; transition:background 0.3s; }
        .dot.online  { background:#34d399; box-shadow:0 0 4px rgba(52,211,153,0.6); }
        .dot.offline { background:#f87171; }
        iframe { display:block; width:100vw; background:#cfcfcf; position:absolute; left:0; bottom:0; height:calc(100vh - 44px); border:none; }
        .theme-link { font-size:12px; color:#1a73e8; text-decoration:none; white-space:nowrap; }
        .theme-link:hover { text-decoration:underline; }
    </style>

    <div class="topbar">
        <input type="text" placeholder="Search or enter URL…" id="bar">
        <button class="go-btn" onclick="nav()">Go</button>
        <select id="server" onchange="changeServer()">
            <option value="wss://wisp.mercurywork.shop/">Mercury</option>
            <option value="wss://anura.pro/">Anura</option>
            <option value="wss://geometry1.gleeze.com/">Mine</option>
        </select>
        <div class="stat"><div class="dot" id="dot"></div><span id="stat-lbl">checking…</span></div>
        <a class="theme-link" href="index.html">⬡ themes</a>
    </div>
    <iframe src="" id="frame"></iframe>

    <script>
        const connection = new BareMux.BareMuxConnection("/sail/baremux/worker.js")
        const server = document.getElementById("server")
        connection.setTransport("/sail/libcurl/index.mjs", [{ websocket: server.value }])

        function changeServer() {
            connection.setTransport("/sail/libcurl/index.mjs", [{ websocket: server.value }])
            probe(server.value)
        }

        const frame = document.getElementById("frame")
        const bar   = document.getElementById("bar")

        const { ScramjetController } = $scramjetLoadController()
        const scramjet = new ScramjetController({
            files: { all: "/sail/scram/scramjet.all.js", wasm: "/sail/scram/scramjet.wasm.wasm", sync: "/sail/scram/scramjet.sync.js" },
            prefix: "/sail/go/"
        })
        scramjet.init()

        function nav() {
            let url = bar.value.trim()
            if (!url) return
            if (!url.includes(".")) url = "https://duckduckgo.com/search?q=" + encodeURIComponent(url)
            else if (!url.startsWith("http://") && !url.startsWith("https://")) url = "https://" + url
            frame.src = scramjet.encodeUrl(url)
        }

        bar.addEventListener("keydown", e => { if (e.key === "Enter") nav() })

        let pt = null
        function probe(url) {
            const dot = document.getElementById('dot'), lbl = document.getElementById('stat-lbl')
            dot.className = 'dot'; lbl.textContent = 'checking…'
            clearTimeout(pt)
            let ok = false, ws
            try { ws = new WebSocket(url) } catch(e) { set(false); return }
            const t = setTimeout(() => { if (!ok) { ok=true; set(false); try{ws.close()}catch(_){} } }, 5000)
            ws.onopen  = () => { if (!ok) { ok=true; clearTimeout(t); set(true);  try{ws.close()}catch(_){} } }
            ws.onerror = () => { if (!ok) { ok=true; clearTimeout(t); set(false) } }
            ws.onclose = e  => { if (!ok) { ok=true; clearTimeout(t); set(e.code!==1006) } }
            function set(on) { dot.className='dot '+(on?'online':'offline'); lbl.textContent=on?'connected':'offline'; pt=setTimeout(()=>probe(server.value),30000) }
        }
        probe(server.value)
    </script>
    <script src="/dev-messages.js" defer></script>
	
<script>
(() => {
  if (document.getElementById("sail-dev-message-overlay")) return;

  const style = document.createElement("style");
  style.textContent = `
#sail-dev-message-overlay {
  position: fixed !important;
  inset: 0 !important;
  z-index: 2147483647 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 20px !important;
  background: rgba(0,0,0,.72) !important;
  backdrop-filter: blur(5px) !important;
  -webkit-backdrop-filter: blur(5px) !important;
  font-family: Arial, Helvetica, sans-serif !important;
  box-sizing: border-box !important;
}
.sail-dev-message-box {
  width: min(520px, 100%) !important;
  max-height: 85vh !important;
  overflow-y: auto !important;
  box-sizing: border-box !important;
  padding: 26px !important;
  border-radius: 14px !important;
  background: #111 !important;
  color: #fff !important;
  border: 1px solid rgba(255,255,255,.2) !important;
  box-shadow: 0 20px 70px rgba(0,0,0,.6) !important;
  text-align: left !important;
}
.sail-dev-message-title {
  font-size: 21px !important;
  font-weight: 700 !important;
  margin-bottom: 16px !important;
  color: #fff !important;
}
.sail-dev-message-text {
  font-size: 16px !important;
  line-height: 1.5 !important;
  overflow-wrap: anywhere !important;
}
.sail-backup-domain {
  display: block !important;
  padding: 12px 14px !important;
  margin-top: 10px !important;
  border: 1px solid rgba(255,255,255,.12) !important;
  border-radius: 8px !important;
  background: rgba(255,255,255,.05) !important;
  color: #fff !important;
  text-decoration: none !important;
  transition: background .2s ease, border-color .2s ease !important;
}
.sail-backup-domain:hover {
  background: rgba(255,255,255,.12) !important;
  border-color: rgba(255,255,255,.3) !important;
}
.sail-backup-domain::after {
  content: "↗";
  float: right;
  opacity: .65;
}
.sail-popup-actions {
  display: flex !important;
  justify-content: flex-end !important;
  margin-top: 18px !important;
}
.sail-popup-ok {
  border: 1px solid rgba(255,255,255,.25) !important;
  border-radius: 8px !important;
  padding: 9px 22px !important;
  background: #fff !important;
  color: #111 !important;
  font-size: 14px !important;
  font-weight: 700 !important;
  cursor: pointer !important;
}
.sail-popup-ok:hover { background: #e8e8e8 !important; }
@media (max-width: 480px) {
  .sail-dev-message-box { padding: 22px !important; }
  .sail-dev-message-title { font-size: 19px !important; }
}
`;
  document.head.appendChild(style);

  const overlay = document.createElement("div");
  overlay.id = "sail-dev-message-overlay";

  const box = document.createElement("div");
  box.className = "sail-dev-message-box";

  const title = document.createElement("div");
  title.className = "sail-dev-message-title";
  title.textContent = "Check Out Our Backup Domains";

  const list = document.createElement("div");
  list.className = "sail-dev-message-text";
  list.textContent = "Loading domains...";

  const actions = document.createElement("div");
  actions.className = "sail-popup-actions";

  const okButton = document.createElement("button");
  okButton.className = "sail-popup-ok";
  okButton.type = "button";
  okButton.textContent = "OK";
  okButton.addEventListener("click", () => overlay.remove());

  actions.appendChild(okButton);
  box.appendChild(title);
  box.appendChild(list);
  box.appendChild(actions);
  overlay.appendChild(box);

  function showPopup() {
    if (!document.body.contains(overlay)) {
      document.body.appendChild(overlay);
    }
  }

  async function loadDomains() {
    try {
      const response = await fetch("./domains.txt", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const text = await response.text();

      const domains = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line && !line.startsWith("#"));

      list.replaceChildren();

      let count = 0;

      domains.forEach(domain => {
        try {
          // Accept full URLs or plain domain names.
          const url = new URL(
            /^[a-z][a-z0-9+.-]*:\/\//i.test(domain)
              ? domain
              : `https://${domain}`
          );

          // Only allow HTTP and HTTPS links.
          if (!["https:", "http:"].includes(url.protocol)) return;

          const link = document.createElement("a");
          link.className = "sail-backup-domain";
          link.href = url.href;
          link.textContent = url.hostname;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          list.appendChild(link);
          count++;
        } catch {
          // Skip invalid entries.
        }
      });

      if (count === 0) {
        list.textContent = "No valid domains found in domains.txt.";
      }
    } catch (error) {
      list.textContent =
        "Unable to load domains.txt. Check that the file exists and is accessible.";
      console.error("Failed to load domains.txt:", error);
    }
  }

  if (document.body) showPopup();
  else {
    document.addEventListener("DOMContentLoaded", showPopup, {
      once: true
    });
  }

  loadDomains();
})();
</script>

</body>
</html>
