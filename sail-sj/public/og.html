<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stuff</title>
    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>
    <script>
        navigator.serviceWorker.register("/sail/sw.js")
    </script>
</head>
<body>
<script>
        window.addEventListener('beforeunload', function (event) {
            event.preventDefault();
            event.returnValue = ''; 
        });
    </script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        .topbar { position:relative; z-index:10; display:flex; align-items:center; gap:8px; padding:8px; box-sizing:border-box; width:100%; background:#fff; border-bottom:1px solid #ddd; }
        #bar { flex:1; min-width:0; padding:6px 10px; border:1px solid #ccc; border-radius:4px; font-size:14px; }
        #bar:focus { outline:none; border-color:#888; }
        #server { flex:0 0 120px; padding:6px; border:1px solid #ccc; border-radius:4px; font-size:13px; }
        .stat { display:flex; align-items:center; gap:5px; font-size:12px; color:#666; flex-shrink:0; }
        .dot { width:8px; height:8px; border-radius:50%; background:#ccc; flex-shrink:0; transition:background 0.3s; }
        .dot.online  { background:#34d399; box-shadow:0 0 4px rgba(52,211,153,0.6); }
        .dot.offline { background:#f87171; }
        iframe { display:block; width:100vw; background:#cfcfcf; position:absolute; left:0; bottom:0; height:calc(100vh - 44px); border:none; }
        .theme-link { font-size:12px; color:#1a73e8; text-decoration:none; white-space:nowrap; }
        .theme-link:hover { text-decoration:underline; }
    </style>

    <div class="topbar">
        <input type="text" placeholder="Search or enter URL…" id="bar">
        <button class="go-btn" onclick="nav()">Go</button>
        <select id="server" onchange="changeServer()">
            <option value="wss://wisp.mercurywork.shop/">Mercury</option>
            <option value="wss://anura.pro/">Anura</option>
            <option value="wss://geometry1.gleeze.com/">Mine</option>
        </select>
        <div class="stat"><div class="dot" id="dot"></div><span id="stat-lbl">checking…</span></div>
        <a class="theme-link" href="index.html">⬡ themes</a>
    </div>
    <iframe src="" id="frame"></iframe>

    <script>
        const connection = new BareMux.BareMuxConnection("/sail/baremux/worker.js")
        const server = document.getElementById("server")
        connection.setTransport("/sail/libcurl/index.mjs", [{ websocket: server.value }])

        function changeServer() {
            connection.setTransport("/sail/libcurl/index.mjs", [{ websocket: server.value }])
            probe(server.value)
        }

        const frame = document.getElementById("frame")
        const bar   = document.getElementById("bar")

        const { ScramjetController } = $scramjetLoadController()
        const scramjet = new ScramjetController({
            files: { all: "/sail/scram/scramjet.all.js", wasm: "/sail/scram/scramjet.wasm.wasm", sync: "/sail/scram/scramjet.sync.js" },
            prefix: "/sail/go/"
        })
        scramjet.init()

        function nav() {
            let url = bar.value.trim()
            if (!url) return
            if (!url.includes(".")) url = "https://duckduckgo.com/search?q=" + encodeURIComponent(url)
            else if (!url.startsWith("http://") && !url.startsWith("https://")) url = "https://" + url
            frame.src = scramjet.encodeUrl(url)
        }

        bar.addEventListener("keydown", e => { if (e.key === "Enter") nav() })

        let pt = null
        function probe(url) {
            const dot = document.getElementById('dot'), lbl = document.getElementById('stat-lbl')
            dot.className = 'dot'; lbl.textContent = 'checking…'
            clearTimeout(pt)
            let ok = false, ws
            try { ws = new WebSocket(url) } catch(e) { set(false); return }
            const t = setTimeout(() => { if (!ok) { ok=true; set(false); try{ws.close()}catch(_){} } }, 5000)
            ws.onopen  = () => { if (!ok) { ok=true; clearTimeout(t); set(true);  try{ws.close()}catch(_){} } }
            ws.onerror = () => { if (!ok) { ok=true; clearTimeout(t); set(false) } }
            ws.onclose = e  => { if (!ok) { ok=true; clearTimeout(t); set(e.code!==1006) } }
            function set(on) { dot.className='dot '+(on?'online':'offline'); lbl.textContent=on?'connected':'offline'; pt=setTimeout(()=>probe(server.value),30000) }
        }
        probe(server.value)
    </script>
    <script src="/dev-messages.js" defer></script>
	

<script>
/* -- Backup Domains button + panel -- */
(function() {
  var loaded = false;

  function init() {
    var ac='rgba(26,115,232,0.8)',bg='#111',bd='rgba(255,255,255,0.14)',hv='rgba(26,115,232,0.12)',lb='rgba(26,115,232,0.35)';
    var s=document.createElement('style');
    s.textContent=
      '#sdp{position:fixed;bottom:60px;left:20px;width:260px;background:'+bg+';border:1px solid '+bd+';border-radius:12px;box-shadow:0 16px 50px rgba(0,0,0,.6);overflow:hidden;z-index:9999;display:none;flex-direction:column}'+
      '#sdp.open{display:flex}'+
      '#sdp .dh{padding:14px 16px 10px;border-bottom:1px solid '+bd+';display:flex;align-items:center;justify-content:space-between}'+
      '#sdp .dt{font-size:13px;font-weight:600;color:#fff}'+
      '#sdp .dx{width:22px;height:22px;display:grid;place-items:center;border:none;background:rgba(255,255,255,.07);border-radius:5px;cursor:pointer;color:rgba(255,255,255,.5);font-size:14px;transition:background .15s}'+
      '#sdp .dx:hover{background:rgba(255,255,255,.14);color:#fff}'+
      '#sdp .dl{padding:8px;display:flex;flex-direction:column;gap:4px;max-height:240px;overflow-y:auto}'+
      '#sdp .da{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid rgba(255,255,255,.07);border-radius:7px;background:rgba(255,255,255,.03);color:rgba(255,255,255,.75);text-decoration:none;font-size:12px;transition:background .15s}'+
      '#sdp .da:hover{background:'+hv+';border-color:'+lb+';color:#fff}'+
      "#sdp .da::after{content:'\u2197';font-size:10px;opacity:.4}"+
      '#sdp .de{padding:12px;font-size:11px;color:rgba(255,255,255,.25);text-align:center}'+
      '#sdb{position:fixed;bottom:20px;left:20px;display:flex;align-items:center;gap:7px;padding:8px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:rgba(255,255,255,.5);font-size:12px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,color .15s;z-index:9999;font-family:inherit}'+
      '#sdb:hover{background:rgba(255,255,255,.09);border-color:'+ac+';color:'+ac+'}';
    document.head.appendChild(s);

    var btn=document.createElement('button');
    btn.id='sdb';
    btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Backup domains';
    document.body.appendChild(btn);

    var panel=document.createElement('div');
    panel.id='sdp';
    panel.innerHTML='<div class="dh"><span class="dt">Backup Domains</span><button class="dx">&#x2715;</button></div><div class="dl" id="sdl"><div class="de">Loading...</div></div>';
    document.body.appendChild(panel);

    panel.querySelector('.dx').addEventListener('click',function(){panel.classList.remove('open');});
    btn.addEventListener('click',function(){
      panel.classList.toggle('open');
      if(panel.classList.contains('open')&&!loaded) fetchDomains();
      if(panel.classList.contains('open')) setTimeout(function(){document.addEventListener('click',outside);},0);
    });
    function outside(e){if(!panel.contains(e.target)&&!btn.contains(e.target)){panel.classList.remove('open');document.removeEventListener('click',outside);}}
  }

  async function fetchDomains(){
    var list=document.getElementById('sdl');
    try{
      var r=await fetch('./domains.txt',{cache:'no-store'});
      if(!r.ok) throw new Error();
      var lines=(await r.text()).split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l&&!l.startsWith('#');});
      list.innerHTML='';
      var n=0;
      for(var i=0;i<lines.length;i++){
        try{
          var u=new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(lines[i])?lines[i]:'https://'+lines[i]);
          if(!['https:','http:'].includes(u.protocol)||!u.hostname) continue;
          var a=document.createElement('a');
          a.className='da';a.href=u.href;a.textContent=u.hostname;a.target='_blank';a.rel='noopener noreferrer';
          list.appendChild(a);n++;
        }catch(e){}
      }
      if(n===0) list.innerHTML='<div class="de">No domains found</div>';
      loaded=true;
    }catch(e){list.innerHTML='<div class="de">Could not load domains.txt</div>';}
  }

  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();
</script>


</body>
</html>
